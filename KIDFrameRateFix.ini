; KIDFrameRateFix - high frame rate fixes for Killer Is Dead: Nightmare Edition
; Place beside KidGame.exe in Binaries\Win32. Every option defaults to the value shown.

[FrameRate]
; Removes the stock 31 FPS frame-rate smoothing cap at runtime (no KidEngine.ini edit needed).
UnlockFrameRate=1
; Optional frame cap in FPS (30-1000). 0 = uncapped. Use this instead of the
; engine's own smoothing, which paces frames with coarse sleeps.
FrameRateLimit=0

[Display]
; Startup resolution: auto = your desktop resolution, WIDTHxHEIGHT (e.g. 1920x1080) = that size,
; 0 = the game's own setting. ResX=/ResY= in Steam launch options take priority.
Resolution=auto
; Sizes the black cinematic fade to the game window instead of a fixed 1920x1080.
FullscreenFadeFix=1
; hor+ = screens wider than 16:9 show more at the sides, vert- = retail (they lose the top and bottom).
; Identical at 16:9 and narrower.
FOVMode=hor+
; Gameplay field of view in degrees, horizontal at 16:9 (30-120). 60 = retail.
; Zoomed views (aiming, lock-on, battle) scale with it. Cutscene camera shots keep their framing.
FOV=60
; Supersampling (SSAA) factor per axis, 1-4. The 3D scene renders this many times wider AND
; taller, then scales down; the HUD and menus stay at your resolution. Heavy on the GPU.
;   1 = off
;   2 = 4x SSAA  (2x2 samples per pixel; 1440p renders at 5120x2880)  <- best quality per cost
;   3 = 9x SSAA  (3x3; 1440p renders at 7680x4320)
;   4 = 16x SSAA (4x4; 1440p renders at 10240x5760)
; In-between values such as 1.5 work but filter less cleanly than whole numbers.
Supersampling=1

[Limiter]
; 0 disables every patch.
Enabled=1
; Rate of the game's frame-counted HUD scripts. Leave at 30.
UITickFPS=30
; Full-rate UI: script-driven UI animation runs every frame; frame-counted helpers keep a 30 Hz clock.
SmoothUIExperimental=1
MaxCatchUpTicks=8
MaxDeltaMilliseconds=250
NewMessageTimingFix=1

[Gameplay]
CardiacMassageDeltaFix=1
CardiacMassageDiagnostics=0
ParticleCollisionFix=1
KismetLatentTimingFix=1
SebastianStunFallFix=1
; Limits known per-frame feedback cues to the stock 30 FPS cadence. Damage and collision are unaffected.
SoundRetriggerFix=1
; Boss state logic restored to 30 Hz, receiving the accumulated game DeltaTime.
GiantHeadStunTimingFix=1
ThomasMotionTimingFix=1
GiantHeadBeamTimingFix=1
SebastianAbsorbTimingFix=1
; Per-frame constants rescaled from real frame time.
CollectableAbsorbFix=1
DroppedPickupFix=1
GiantHeadThrowSpinFix=1
; Stops leftover walk/run root motion from moving the player after cinematic mode has frozen them.
CinematicRootMotionFix=1
; Applies the PCGamingWiki audio settings for the crash after boss fights (MaxChannels >= 64,
; CommonAudioPoolSize 320, MinCompressedDurationGame <= 0.3) without editing KidEngine.ini.
AudioDeviceFix=1

[Diagnostics]
; Logs Sebastian's fall-state events and the third critical-hit Matinee boundaries.
BossFinisherTiming=0
; Logs the average frame rate every 5 seconds.
FrameRateReport=0
; Logs a 10-second census of the game's timer and wait calls, 15 s after the first UI frame.
TimingProbe=0
; Writes a full memory dump (KIDFrameRateFix-crash.dmp) on the first access violation in KidGame.exe.
CrashDump=0
; Extra UI functions ("Class.Function", Class may end in *) kept on the 30 Hz gate in smooth-UI mode.
SmoothUIGate=
; Comma-separated UnrealScript functions ("Function" or "Class.Function") to log on every call.
ScriptTrace=
